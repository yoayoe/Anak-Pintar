server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No client-side router in this app, but this keeps deep reloads working
    # if that ever changes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .webmanifest isn't in nginx's default mime.types. A `types {}` block
    # here would replace (not extend) the inherited table - included
    # nginx.conf's mime.types is itself already wrapped in its own `types {}`,
    # so nesting it inside another one is a syntax error. default_type on a
    # scoped location is the clean way to add just this one exception.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    # Service worker must never be served stale, or updates won't take effect.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
