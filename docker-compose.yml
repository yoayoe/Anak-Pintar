services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Cloudflare Tunnel (set up manually outside this compose file) points
      # at this port. Keep it bound to localhost unless you also want it
      # reachable directly on the LAN without going through the tunnel.
      - '8081:3000'
    volumes:
      - app-data:/data

volumes:
  app-data:
