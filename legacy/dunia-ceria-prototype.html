<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dunia Ceria - Game Anak</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(180deg, #aee9ff 0%, #d6f5c9 100%);
    touch-action: manipulation;
  }
  #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: block; }

  /* ---------- MENU ---------- */
  #menu { display: flex; }
  #menu.active { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; }
  #menu h1 { font-size: 6vh; color: #ff6f91; margin: 0 0 2vh; text-shadow: 2px 2px 0 #fff; }
  #menu .cards { display: flex; gap: 4vw; flex-wrap: wrap; justify-content: center; }
  .card {
    width: 24vh; height: 24vh; border-radius: 30px; border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 3vh; color: #fff; cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,0.15);
    transition: transform .08s;
  }
  .card:active { transform: scale(0.92) translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .card .emoji { font-size: 9vh; margin-bottom: 1vh; }
  .card.c1 { background: #ff9aa2; }
  .card.c2 { background: #ffd97d; }
  .card.c3 { background: #9adcff; }

  /* ---------- SHARED ---------- */
  .home-btn {
    position: absolute; top: 2vh; left: 2vh; width: 8vh; height: 8vh; border-radius: 50%;
    background: #fff; border: none; font-size: 4vh; box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 50;
  }
  .home-btn:active { transform: scale(0.9); }
  .star-bar { position: absolute; top: 2vh; right: 2vh; font-size: 4vh; color: #ffb400; text-shadow: 1px 1px 0 #fff; z-index: 50; }

  /* ---------- BALLOON GAME ---------- */
  #balloonGame { background: linear-gradient(180deg, #7fd0ff 0%, #bdeaff 100%); }
  .balloon {
    position: absolute; bottom: -20vh; width: 12vh; height: 15vh; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 5vh;
    box-shadow: inset -8px -8px 15px rgba(0,0,0,0.15), inset 8px 8px 15px rgba(255,255,255,0.3);
  }
  .balloon::after {
    content: ''; position: absolute; bottom: -6vh; left: 50%; width: 2px; height: 6vh; background: rgba(0,0,0,0.25);
  }
  .pop-particle { position: absolute; font-size: 4vh; pointer-events: none; }

  /* ---------- ANIMAL GAME ---------- */
  #animalGame { background: linear-gradient(180deg, #d4f5c1 0%, #fff6c9 100%); }
  .animal-grid {
    position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 2vh; padding: 14vh 3vw 3vh;
  }
  .animal-btn {
    border: none; border-radius: 24px; background: #ffffffaa; font-size: 9vh; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform .1s;
    box-shadow: 0 6px 0 rgba(0,0,0,0.1);
  }
  .animal-btn:active, .animal-btn.bounce { transform: scale(1.2); }
  .speech-bubble {
    position: absolute; left: 50%; top: 6vh; transform: translateX(-50%);
    background: #fff; border-radius: 20px; padding: 1.5vh 3vw; font-size: 4vh; font-weight: bold;
    color: #ff6f91; box-shadow: 0 4px 0 rgba(0,0,0,0.1); opacity: 0; transition: opacity .2s; white-space: nowrap;
  }
  .speech-bubble.show { opacity: 1; }

  /* ---------- COLOR GAME ---------- */
  #colorGame { background: linear-gradient(180deg, #f9d6ff 0%, #d6e4ff 100%); }
  #colorPrompt {
    position: absolute; top: 12vh; left: 50%; transform: translateX(-50%); text-align: center;
    font-size: 4vh; color: #555; font-weight: bold;
  }
  #targetSwatch {
    width: 14vh; height: 14vh; border-radius: 50%; margin: 2vh auto 0; box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    border: 6px solid #fff;
  }
  .color-grid {
    position: absolute; bottom: 6vh; left: 0; right: 0; display: flex; justify-content: center; gap: 4vw; flex-wrap: wrap;
    padding: 0 3vw;
  }
  .color-shape {
    width: 18vh; height: 18vh; border: none; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: transform .1s;
  }
  .color-shape:active { transform: scale(0.9); }
  .color-shape.circle { border-radius: 50%; }
  .color-shape.square { border-radius: 20px; }
  .color-shape.wrong { animation: shake .3s; }
  @keyframes shake { 25%{transform:translateX(-2vh)} 75%{transform:translateX(2vh)} }

  .feedback-msg {
    position: absolute; left: 50%; bottom: 2vh; transform: translateX(-50%);
    font-size: 3.5vh; color: #4caf50; font-weight: bold; opacity: 0; transition: opacity .3s;
  }
  .feedback-msg.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">

  <!-- MENU -->
  <div id="menu" class="screen active">
    <h1>🌈 Dunia Ceria 🌈</h1>
    <div class="cards">
      <button class="card c1" onclick="goTo('balloonGame')">
        <span class="emoji">🎈</span> Balon
      </button>
      <button class="card c2" onclick="goTo('animalGame')">
        <span class="emoji">🐶</span> Suara Hewan
      </button>
      <button class="card c3" onclick="goTo('colorGame')">
        <span class="emoji">🌈</span> Warna
      </button>
    </div>
  </div>

  <!-- BALLOON GAME -->
  <div id="balloonGame" class="screen">
    <button class="home-btn" onclick="goTo('menu')">🏠</button>
    <div class="star-bar">⭐ <span id="balloonScore">0</span></div>
  </div>

  <!-- ANIMAL GAME -->
  <div id="animalGame" class="screen">
    <button class="home-btn" onclick="goTo('menu')">🏠</button>
    <div class="speech-bubble" id="speechBubble"></div>
    <div class="animal-grid" id="animalGrid"></div>
  </div>

  <!-- COLOR GAME -->
  <div id="colorGame" class="screen">
    <button class="home-btn" onclick="goTo('menu')">🏠</button>
    <div class="star-bar">⭐ <span id="colorScore">0</span></div>
    <div id="colorPrompt">Cari warna ini!
      <div id="targetSwatch"></div>
    </div>
    <div class="color-grid" id="colorGrid"></div>
    <div class="feedback-msg" id="colorFeedback"></div>
  </div>

</div>

<script>
/* ---------------- Navigation ---------------- */
let balloonInterval = null;
function goTo(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');

  if (balloonInterval) { clearInterval(balloonInterval); balloonInterval = null; }
  document.querySelectorAll('.balloon, .pop-particle').forEach(el => el.remove());

  if (screenId === 'balloonGame') startBalloons();
  if (screenId === 'animalGame') buildAnimalGrid();
  if (screenId === 'colorGame') newColorRound();
}

/* ---------------- Sound (Web Audio, no files needed) ---------------- */
let audioCtx = null;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type = 'sine', vol = 0.2, delay = 0) {
  try {
    const c = ctx();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + delay);
    o.stop(c.currentTime + delay + dur);
  } catch (e) {}
}
function playPop() { tone(600, 0.08, 'triangle', 0.25); tone(900, 0.08, 'triangle', 0.15, 0.05); }
function playSuccess() { tone(523, 0.12, 'sine', 0.2); tone(659, 0.12, 'sine', 0.2, 0.1); tone(784, 0.18, 'sine', 0.2, 0.2); }
function playGentle() { tone(300, 0.15, 'sine', 0.12); }

function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID';
    u.rate = 0.9;
    u.pitch = 1.2;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------------- Balloon Pop Game ---------------- */
const balloonColors = ['#ff6f91', '#ffb400', '#63d471', '#4dd0e1', '#ba68c8', '#ff8a65'];
const balloonEmojis = ['🎈'];
let balloonScore = 0;

function startBalloons() {
  balloonScore = 0;
  document.getElementById('balloonScore').textContent = balloonScore;
  spawnBalloon();
  balloonInterval = setInterval(spawnBalloon, 2000);
}

function spawnBalloon() {
  const game = document.getElementById('balloonGame');
  const b = document.createElement('div');
  b.className = 'balloon';
  b.style.left = (5 + Math.random() * 80) + 'vw';
  b.style.background = balloonColors[Math.floor(Math.random() * balloonColors.length)];
  b.textContent = balloonEmojis[0];
  const duration = 11 + Math.random() * 4;
  b.style.transition = `transform ${duration}s linear, opacity .2s`;
  game.appendChild(b);

  requestAnimationFrame(() => {
    b.style.transform = `translateY(-135vh)`;
  });

  const cleanup = setTimeout(() => b.remove(), duration * 1000 + 100);

  b.addEventListener('click', () => {
    clearTimeout(cleanup);
    popBalloon(b);
  });
}

function popBalloon(b) {
  const rect = b.getBoundingClientRect();
  playPop();
  balloonScore++;
  document.getElementById('balloonScore').textContent = balloonScore;

  for (let i = 0; i < 5; i++) {
    const p = document.createElement('div');
    p.className = 'pop-particle';
    p.textContent = ['✨','⭐','🎉'][Math.floor(Math.random()*3)];
    p.style.left = (rect.left + rect.width/2) + 'px';
    p.style.top = (rect.top + rect.height/2) + 'px';
    document.body.appendChild(p);
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    p.style.transition = 'transform .5s ease-out, opacity .5s';
    document.body.appendChild(p);
    requestAnimationFrame(() => {
      p.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
      p.style.opacity = '0';
    });
    setTimeout(() => p.remove(), 550);
  }
  b.remove();
}

/* ---------------- Animal Sounds Game ---------------- */
const animals = [
  { emoji: '🐶', say: 'Guk guk! Anjing!' },
  { emoji: '🐱', say: 'Meong! Kucing!' },
  { emoji: '🐮', say: 'Moo! Sapi!' },
  { emoji: '🐷', say: 'Oink oink! Babi!' },
  { emoji: '🐔', say: 'Kukuruyuk! Ayam!' },
  { emoji: '🐸', say: 'Kwek kwek! Kodok!' },
  { emoji: '🦆', say: 'Kwak kwak! Bebek!' },
  { emoji: '🐑', say: 'Mbeek! Domba!' },
  { emoji: '🐘', say: 'Trooot! Gajah!' },
];

function buildAnimalGrid() {
  const grid = document.getElementById('animalGrid');
  grid.innerHTML = '';
  animals.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'animal-btn';
    btn.textContent = a.emoji;
    btn.onclick = () => {
      btn.classList.add('bounce');
      setTimeout(() => btn.classList.remove('bounce'), 200);
      playGentle();
      speak(a.say);
      const bubble = document.getElementById('speechBubble');
      bubble.textContent = a.say;
      bubble.classList.add('show');
      clearTimeout(bubble._t);
      bubble._t = setTimeout(() => bubble.classList.remove('show'), 1600);
    };
    grid.appendChild(btn);
  });
}

/* ---------------- Color Matching Game ---------------- */
const colorDefs = [
  { name: 'Merah', hex: '#ff5252' },
  { name: 'Kuning', hex: '#ffd740' },
  { name: 'Hijau', hex: '#69f0ae' },
  { name: 'Biru', hex: '#40c4ff' },
  { name: 'Ungu', hex: '#b388ff' },
  { name: 'Oranye', hex: '#ffab40' },
];
let colorScore = 0;
let currentTarget = null;

function newColorRound() {
  const grid = document.getElementById('colorGrid');
  grid.innerHTML = '';
  document.getElementById('colorScore').textContent = colorScore;

  const shuffled = [...colorDefs].sort(() => Math.random() - 0.5).slice(0, 4);
  currentTarget = shuffled[Math.floor(Math.random() * shuffled.length)];
  document.getElementById('targetSwatch').style.background = currentTarget.hex;

  shuffled.sort(() => Math.random() - 0.5).forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'color-shape ' + (i % 2 === 0 ? 'circle' : 'square');
    btn.style.background = c.hex;
    btn.onclick = () => {
      if (c.name === currentTarget.name) {
        playSuccess();
        colorScore++;
        speak('Betul! Ini warna ' + c.name + '!');
        const fb = document.getElementById('colorFeedback');
        fb.textContent = '🎉 Betul! Warna ' + c.name;
        fb.classList.add('show');
        setTimeout(() => fb.classList.remove('show'), 1000);
        setTimeout(newColorRound, 900);
      } else {
        playGentle();
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 300);
        speak('Coba lagi ya');
      }
    };
    grid.appendChild(btn);
  });
}
</script>
</body>
</html>
